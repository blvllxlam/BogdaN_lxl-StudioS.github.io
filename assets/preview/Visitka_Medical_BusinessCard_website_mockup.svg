<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fbfa"/><stop offset="1" stop-color="#eaf4f5"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e7475"/><stop offset="1" stop-color="#164e63"/></linearGradient>
  <linearGradient id="phoneScreen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fcfb"/><stop offset="1" stop-color="#edf6f5"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#164e63" flood-opacity=".18"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".10"/></filter>
  <clipPath id="laptopClip"><rect x="92" y="130" width="1010" height="670" rx="4"/></clipPath>
  <clipPath id="phoneClip"><rect x="1172" y="188" width="328" height="704" rx="38"/></clipPath>
  <style>
    .sans{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,serif}
  </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>

